<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>测一测，你是绝望主妇里的谁?</title>
<meta name="description" content="你以为你在经营生活，其实是生活一直在经营你。20 题，测出你在紫藤巷的位置。">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
  :root{
    --cream:#f6efe3;
    --cream-2:#efe5d5;
    --ink:#2b232a;
    --ink-2:#5a4b57;
    --plum:#5a2f45;
    --wisteria:#8b77a6;
    --sage:#6d7c67;
    --line:rgba(90,47,69,.16);
    --card:#fffaf2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #fbf6ec 0%, rgba(251,246,236,0) 60%),
      radial-gradient(900px 900px at 110% 110%, rgba(139,119,166,.16) 0%, rgba(139,119,166,0) 55%),
      var(--cream);
    color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-weight:400;
    line-height:1.7;
    min-height:100vh;
    display:block;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:clamp(28px,8vh,72px) 18px 40px;min-height:100vh;display:flex;flex-direction:column}
  .serif{font-family:"Noto Serif SC","Songti SC",Georgia,serif}
  .en{font-family:"Playfair Display",Georgia,serif;letter-spacing:.14em;text-transform:uppercase}

  /* ===== 封面 ===== */
  .cover{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;animation:fade .8s ease both}
  .label{font-size:11px;letter-spacing:.36em;color:var(--plum);opacity:.75;margin-bottom:26px}
  .label::before,.label::after{content:"";display:inline-block;width:26px;height:1px;background:var(--line);vertical-align:middle;margin:0 12px 2px}
  .cover h1{
    font-size:clamp(30px,7.8vw,40px);line-height:1.42;margin:0 0 18px;font-weight:600;letter-spacing:.02em;
  }
  .cover h1 em{font-style:normal;color:var(--plum)}
  .sub{font-size:14px;color:var(--ink-2);letter-spacing:.06em;line-height:2;margin:0 auto 44px;max-width:19em}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:0 0 34px}
  .meta{font-size:11px;letter-spacing:.22em;color:var(--ink-2);opacity:.7;margin-bottom:30px}
  .btn{
    display:block;width:100%;border:none;cursor:pointer;
    background:var(--plum);color:#fdf8ef;
    font-family:inherit;font-size:16px;letter-spacing:.22em;font-weight:500;
    padding:19px 0 20px;border-radius:3px;
    box-shadow:0 14px 28px -14px rgba(90,47,69,.6);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn:hover{background:#4b2439;box-shadow:0 18px 32px -14px rgba(90,47,69,.65)}
  .btn:active{transform:translateY(1px) scale(.995)}
  .btn.ghost{
    background:transparent;color:var(--plum);border:1px solid var(--line);
    box-shadow:none;font-size:13px;letter-spacing:.2em;padding:15px 0;
  }
  .btn.ghost:hover{background:rgba(90,47,69,.05);box-shadow:none}
  .foot{margin-top:26px;font-size:10px;letter-spacing:.14em;color:var(--ink-2);opacity:.55}

  /* ===== 测试 ===== */
  .quiz{flex:1;display:flex;flex-direction:column;animation:fade .5s ease both}
  .topbar{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.18em;color:var(--ink-2)}
  .topbar .idx{color:var(--plum);font-weight:500}
  .bar{height:2px;background:rgba(43,35,42,.1);margin:14px 0 0;border-radius:2px;overflow:hidden}
  .bar span{display:block;height:100%;width:0;background:var(--wisteria);transition:width .35s ease}
  .q{margin:clamp(34px,7vh,58px) 0 26px}
  .q .num{font-size:10px;letter-spacing:.3em;color:var(--wisteria);margin-bottom:12px}
  .q h2{font-size:clamp(20px,5vw,24px);line-height:1.6;font-weight:600;margin:0;letter-spacing:.01em}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .opt{
    display:flex;gap:13px;align-items:flex-start;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:3px;
    padding:15px 16px;cursor:pointer;font-family:inherit;font-size:14.5px;line-height:1.65;color:var(--ink);
    transition:border-color .18s ease, transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .opt .k{
    flex:0 0 auto;width:20px;height:20px;border:1px solid var(--line);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--plum);font-family:"Playfair Display",serif;margin-top:2px;
    transition:all .18s ease;
  }
  .opt:hover{border-color:rgba(90,47,69,.4);transform:translateY(-1px);box-shadow:0 10px 20px -16px rgba(43,35,42,.5)}
  .opt.on{background:#fdf5ea;border-color:var(--wisteria);box-shadow:inset 0 0 0 1px rgba(139,119,166,.4)}
  .opt.on .k{background:var(--plum);color:#fdf8ef;border-color:var(--plum)}
  .back{
    align-self:flex-start;background:none;border:none;color:var(--ink-2);font-family:inherit;
    font-size:11px;letter-spacing:.2em;padding:10px 0;cursor:pointer;opacity:.6;margin-top:18px;
  }
  .back:hover{opacity:1}

  /* ===== 结果 ===== */
  .result{flex:1;animation:fade .6s ease both}
  .badge{text-align:center;font-size:10px;letter-spacing:.34em;color:var(--plum);opacity:.8}
  .portrait{
    width:min(62vw,240px);margin:22px auto 0;position:relative;
    border-radius:8px;overflow:hidden;background:var(--cream-2);
    box-shadow:0 26px 46px -26px rgba(43,35,42,.55);
  }
  .portrait::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.55);border-radius:8px;pointer-events:none}
  .portrait{aspect-ratio:3/4}
  .shot{background-size:cover;background-repeat:no-repeat;background-position:center 16%}
  .shot.bree{background-image:url("assets/bree.jpg");background-position:55% 18%}
  .shot.gaby{background-image:url("assets/gaby.jpg");background-position:47% 22%}
  .shot.lynette{background-image:url("assets/lynette.jpg");background-position:center 10%}
  .shot.katherine{background-image:url("assets/katherine.jpg");background-position:center 14%}
  .shot.susan{background-image:url("assets/susan.jpg");background-position:68% 16%}
  .shot.angie{background-image:url("assets/angie.jpg");background-position:center 12%}
  .shot.edie{background-image:url("assets/edie.jpg");background-position:center 10%}
  .shot.julie{background-image:url("assets/julie.jpg");background-position:center 10%}
  .names{text-align:center;margin:22px 0 0}
  .names .cn{font-size:clamp(26px,7vw,32px);font-weight:600;letter-spacing:.04em;line-height:1.3}
  .names .py{font-size:12px;letter-spacing:.2em;color:var(--ink-2);margin-top:8px}
  .role{text-align:center;font-size:12px;letter-spacing:.08em;color:var(--plum);opacity:.85;margin-top:10px}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:30px 0 26px}
  .para{font-size:15px;line-height:2.05;color:var(--ink);text-align:justify;margin:0;letter-spacing:.01em}
  .law{
    margin:26px 0 0;padding:16px 18px;background:rgba(255,250,242,.8);
    border-left:2px solid var(--wisteria);border-radius:0 3px 3px 0;
  }
  .law .t{font-size:10px;letter-spacing:.26em;color:var(--wisteria);margin-bottom:7px}
  .law .c{font-size:14px;line-height:1.9;color:var(--ink)}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
  .tag{font-size:11px;letter-spacing:.1em;color:var(--plum);border:1px solid var(--line);border-radius:20px;padding:5px 12px}
  .footnote{font-size:10px;letter-spacing:.08em;color:var(--ink-2);opacity:.5;text-align:center;margin-top:26px;line-height:1.8}

  /* ===== 图鉴 ===== */
  .gallery{flex:1;animation:fade .5s ease both}
  .gallery h2{font-size:22px;font-weight:600;margin:0 0 6px;text-align:center;letter-spacing:.04em}
  .gallery .lead{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--ink-2);opacity:.7;margin-bottom:26px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .gc{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease}
  .gc:hover{transform:translateY(-2px);box-shadow:0 16px 26px -18px rgba(43,35,42,.5)}
  .gc .thumb{display:block;width:100%;aspect-ratio:1/1}
  .gc .info{padding:11px 12px 13px}
  .gc .info .n{font-size:15px;font-weight:600;letter-spacing:.03em}
  .gc .info .e{font-size:9px;letter-spacing:.16em;color:var(--ink-2);margin-top:3px}
  .gc .info .r{font-size:11px;color:var(--plum);opacity:.8;margin-top:6px;line-height:1.6;letter-spacing:.02em}
  .gback{margin-top:22px}

  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (max-width:360px){
    .opt{font-size:13.5px;padding:13px 14px}
    .grid{gap:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ===== 数据：八位主妇 ===== */
const CHARS = {
  bree: {
    cn: "布里", en: "Bree Van de Kamp", img: "assets/bree.jpg", pos: "55% 18%",

  edie: {

    desc: "她想要什么就说什么，抢到了也不道歉。体面人瞧不上她，可每次出事，最先说真话的往往是她。你和她的重合点：不怕被讨厌，因为讨好所有人太耗人了。",

  julie: {

/* ===== 数据：20 题 ===== */
const QS = [
  { q:"搬进紫藤巷第一天，邻居端着一盘点心站在门口。你——", o:[

  { q:"聚会上有人当众戳你的痛处。", o:[

  { q:"你最怕别人说你什么？", o:[

  { q:"家里突然出事，你第一反应是——", o:[

    ["精修、滤镜、最好那条","gaby"],
    ["三年不发一条，发了也没人知道是我","katherine"],
    ["只发家里的菜和院子，别的都不让看","angie"]
  ]},
  { q:"邻居家半夜传出尖叫。", o:[
    ["披上外套就过去，先救人再问为什么","lynette"],
    ["拎着钥匙冲出去，跑一半才想起该报警","susan"],
    ["站到窗边看一眼，确认声音从哪来","angie"],
    ["先拍下来，明天这条街就有话可说了","edie"]
  ]},
  { q:"你哭的时候——", o:[
    ["一个人哭，哭完补好妆","gaby"],
    ["在车里哭，哭完回家做饭","lynette"],
    ["边哭边打电话，一定要有人听见","susan"],
    ["哭完写下来，提醒自己别再来一遍","julie"]
  ]},
  { q:"你最不能原谅的是——", o:[
    ["有人在我的厨房里，动了我的规矩","bree"],
    ["有人骗我，还以为我不知道","katherine"],
    ["有人拿我的真心当笑话","edie"],
    ["有人替我决定我该过什么生活","julie"]
  ]},
  { q:"如果能重来一次——", o:[
    ["我还是选这条路，只是这次我要先说清楚","lynette"],
    ["我会更早离开，也不会带任何人一起走","angie"],
    ["我不会再等那个人回头","edie"],
    ["我会早一点相信自己，而不是等谁来救我","susan"]
  ]}
];

const ORDER = ["bree","gaby","lynette","katherine","susan","angie","edie","julie"];
const LETTER = ["A","B","C","D"];
const state = { i: 0, answers: new Array(QS.length).fill(null), locked: false };
const app = document.getElementById("app");

/* ===== 计分 ===== */
function score(){
  const tally = {};
  ORDER.forEach(k => tally[k] = 0);
  state.answers.forEach((k, idx) => { if (k) tally[k]++; });
  let best = 0;
  ORDER.forEach(k => { if (tally[k] > best) best = tally[k]; });
  let cands = ORDER.filter(k => tally[k] === best);
  if (cands.length > 1){
    [0, 12, 19].forEach(idx => {
      const a = state.answers[idx];
      if (a && cands.includes(a) && cands.length > 1) cands = [a];
    });
  }
  return cands[0] || ORDER[0];
}

/* ===== 视图 ===== */
function cover(){
  app.innerHTML = `
    <section class="cover">
      <div class="label">紫藤巷 · 人格测试</div>
      <h1 class="serif">测一测，你是<br><em>绝望主妇</em>里的谁？</h1>
      <p class="sub">你以为你在经营生活，<br>其实是生活一直在经营你。</p>
      <div class="rule"></div>
      <div class="meta">20 题 &nbsp;·&nbsp; 约 2 分钟 &nbsp;·&nbsp; 8 位主妇</div>
      <button class="btn" id="start">点击测试</button>
      <div class="foot">人物出自电视剧《绝望主妇》&nbsp;/&nbsp;结果仅供娱乐</div>
    </section>`;
  document.getElementById("start").onclick = () => { state.i = 0; state.answers.fill(null); quiz(); };
}

function quiz(){
  const cur = QS[state.i];
  const done = state.answers.filter(Boolean).length;
  app.innerHTML = `
    <section class="quiz">
      <div class="topbar">
        <span class="idx serif">${String(state.i + 1).padStart(2,"0")} / 20</span>
        <span>${done} ANSWERED</span>
      </div>
      <div class="bar"><span style="width:${(state.i) / QS.length * 100}%"></span></div>
      <div class="q">
        <div class="num">QUESTION ${String(state.i + 1).padStart(2,"0")}</div>
        <h2 class="serif">${cur.q}</h2>
      </div>
      <div class="opts" id="opts">
        ${cur.o.map((it, idx) => `
          <button class="opt ${state.answers[state.i] === it[1] ? "on" : ""}" data-k="${it[1]}">
            <span class="k">${LETTER[idx]}</span><span>${it[0]}</span>
          </button>`).join("")}
      </div>
      ${state.i > 0 ? `<button class="back" id="back">← 上一题</button>` : ``}
    </section>`;

  const bar = app.querySelector(".bar span");
  requestAnimationFrame(() => { bar.style.width = ((state.i) / QS.length * 100) + "%"; });

  app.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      if (state.locked) return;
      state.locked = true;
      el.classList.add("on");
      state.answers[state.i] = el.dataset.k;
      setTimeout(() => {
        state.locked = false;
        if (state.i === QS.length - 1){ result(); }
        else { state.i++; quiz(); }
      }, 240);
    };
  });

  const backBtn = document.getElementById("back");
  if (backBtn) backBtn.onclick = () => { if (state.i > 0 && !state.locked){ state.i--; quiz(); } };
}

function result(){
  const key = score();
  const c = CHARS[key];
  const tally = {};
  ORDER.forEach(k => tally[k] = 0);
  state.answers.forEach(k => { if (k) tally[k]++; });
  app.innerHTML = `
    <section class="result">
      <div class="badge">YOUR WISTERIA LANE</div>
      <div class="portrait shot ${key}" role="img" aria-label="${c.cn}"></div>
      <div class="names">
        <div class="cn serif">${c.cn}</div>
        <div class="py en">${c.en}</div>
        <div class="role">${c.role}</div>
      </div>
      <div class="divider"></div>
      <p class="para serif">${c.desc}</p>
      <div class="law">
        <div class="t">你的生存法则</div>
        <div class="c serif">${c.law}</div>
      </div>
      <div class="tags">${c.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      <div class="divider"></div>
      <button class="btn ghost" id="gallery">看看其他七位主妇 →</button>
      <button class="btn" id="again" style="margin-top:10px">再测一次</button>
      <div class="footnote">你与 ${c.cn} 的重合度 ${tally[key]} / 20<br>人物出自电视剧《绝望主妇》· 结果仅供娱乐</div>
    </section>`;
  document.getElementById("again").onclick = () => { state.i = 0; state.answers.fill(null); quiz(); };
  document.getElementById("gallery").onclick = () => gallery(key);
}

function gallery(mine){
  const list = mine ? ORDER.filter(k => k !== mine).concat([mine]) : ORDER;
  app.innerHTML = `
    <section class="gallery">
      <h2 class="serif">八位主妇图鉴</h2>
      <div class="lead">${mine ? "你的结果是高亮的那一位" : "紫藤巷的常住人口"}</div>
      <div class="grid">
        ${list.map(k => `
          <div class="gc" data-k="${k}" style="${k === mine ? "border-color:var(--wisteria);box-shadow:inset 0 0 0 1px rgba(139,119,166,.35)" : ""}">
            <div class="thumb shot ${k}" role="img" aria-label="${CHARS[k].cn}"></div>
            <div class="info">
              <div class="n serif">${CHARS[k].cn}${k === mine ? " · 你" : ""}</div>
              <div class="e en">${CHARS[k].en}</div>
              <div class="r">${CHARS[k].tags.join(" / ")}</div>
            </div>
          </div>`).join("")}
      </div>
      <button class="btn ghost gback" id="backCover">回到封面</button>
    </section>`;
  app.querySelectorAll(".gc").forEach(el => {
    el.onclick = () => {
      const c = CHARS[el.dataset.k];
      app.innerHTML = `
        <section class="result">
          <div class="badge">WISTERIA LANE</div>
          <div class="portrait shot ${el.dataset.k}" role="img" aria-label="${c.cn}"></div>
          <div class="names">
            <div class="cn serif">${c.cn}</div>
            <div class="py en">${c.en}</div>
            <div class="role">${c.role}</div>
          </div>
          <div class="divider"></div>
          <p class="para serif">${c.desc}</p>
          <div class="law"><div class="t">她的生存法则</div><div class="c serif">${c.law}</div></div>
          <div class="tags">${c.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
          <div class="divider"></div>
          <button class="btn ghost" id="backG">← 回到图鉴</button>
        </section>`;
      document.getElementById("backG").onclick = () => gallery(mine);
    };
  });
  document.getElementById("backCover").onclick = () => { state.i = 0; state.answers.fill(null); cover(); };
}

cover();
</script>
</body>
</html>
